plugins {
    id "com.android.application"
    id 'com.google.gms.google-services'
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.app.secureconnect"
    compileSdk = 35
    ndkVersion = "25.1.8937393"
    
    aaptOptions {
        cruncherEnabled = false
        useNewCruncher = false
    }

    compileOptions {
        coreLibraryDesugaringEnabled true  
        sourceCompatibility = JavaVersion.VERSION_11  // ✅ Changed to 11
        targetCompatibility = JavaVersion.VERSION_11  // ✅ Changed to 11
    }

    kotlinOptions {
        jvmTarget = "11"  // ✅ Changed to 11
    }

    defaultConfig {
        applicationId = "com.app.secureconnect"
        minSdk = 24
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled true
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.2'
}